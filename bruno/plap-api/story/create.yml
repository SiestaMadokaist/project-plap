info:
  name: Write template
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/story/templates/create"
  body:
    type: json
    data: |-
      {
        "id": "boy-meets-boy",
        "inferences": [
          {
            "workflow_id": "workflows/t2i.json",
            "loras": [
              "loras/a.safetensors"
            ],
            "checkpoint": "model.safetensors",
            "positive": "hello, world {{mc:male}}",
            "negative": "-",
            "width": 1200,
            "height": 500,
            "steps": 8,
            "n_iter": 3,
            "seed": -1,
            "references": [
              "https://example.com/ref.png"
            ]
          }
        ],
        "variables": {
          "mc:male": "mizuki from arknights"
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Create or overwrite a template.
