[package]
name = "pkg"
version = "0.1.0"
edition = "2021"

[features]
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
sha3 = "0.12.0"
hex = "0.4.3"
