[package]
name = "domain"
version = "0.1.0"
edition = "2021"

[features]
future = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
pkg = { path = "../pkg" }
tracing = "0.1"

[dev-dependencies]
anyhow = "1.0.104"
pkg = { path = "../pkg", features = ["test-util"] }
