[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "src/bin/api/main.rs"

[[bin]]
name = "ws"
path = "src/bin/ws/main.rs"

[[bin]]
name = "cron"
path = "src/bin/cron/main.rs"

[[bin]]
name = "diffusion-agent"
path = "src/bin/diffusions/main.rs"
required-features = ["datatransfer", "remote-ec2"]

[features]
datatransfer = []
future = []
# everything that talks to EC2 (compute engine + on-instance agent). Off by default:
# aws-sdk-ec2 is by far the slowest dependency to compile.
remote-ec2 = ["dep:aws-sdk-ec2"]

[dependencies]
domain = { workspace = true }
dto = { workspace = true }
pkg = { workspace = true }
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-openai = "0.27"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = { version = "0.22" }
async-trait = "0.1"
dotenvy = "0.15"
aws-sdk-s3 = "1.133.0"
aws-sdk-ec2 = { version = "=1.242.0", optional = true }
anyhow = "1.0.104"
notify = "8.2.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
sha3 = "0.12.0"
getrandom = "0.3"
hex = { workspace = true }
base64 = "0.22"
# ureq transport (not the default reqwest one) keeps sentry off a second copy of
# reqwest/hyper — it runs on its own background thread, blocking, no tokio.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
sentry-tracing = "0.49"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
rstest = "0.23"
pretty_assertions = "1"
mockall = "0.13"
pkg = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
