# getrandom 0.3 / 0.4 need this cfg to select their browser backend on
# wasm32-unknown-unknown (enabling the `wasm_js` feature alone is not enough).
# Only the `frontend` crate targets wasm; native builds (api lambda, tests) are
# unaffected by a wasm-target-scoped rustflag.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
