service: rust-api

provider:
  name: aws
  region: ap-southeast-1
  logRetentionInDays: 7
  runtime: nodejs20.x
  memorySize: 512
  stage: prod
  versionFunctions: false
  deploymentBucket:
    name: serverless.ramadoka.com

  iamRoleStatements:
    - Effect: Allow
      Action:
        - ce:GetCostAndUsage
      Resource:
        - arn:aws:ce:us-east-1:674152176016:/GetCostAndUsage
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource:
        - arn:aws:dynamodb:ap-southeast-1:674152176016:table/production-*
        - arn:aws:dynamodb:ap-southeast-1:674152176016:table/production-*/index/*
    - Effect: Allow
      Action:
        - ec2:*
      Resource:
        - '*'        
    - Effect: Allow
      Action:
        - iam:PassRole
      Resource:
        - '*'
    - Effect: Allow
      Action:
        - s3:*
      Resource:
        - arn:aws:s3:::ap3.ramadoka.com
        - arn:aws:s3:::ap3.ramadoka.com/images/*
        - arn:aws:s3:::v.ramadoka.com
        - arn:aws:s3:::v.ramadoka.com/prompts/*
        - arn:aws:s3:::sydney.ramadoka.com
        - arn:aws:s3:::sydney.ramadoka.com/*
        - arn:aws:s3:::public.ramadoka.com
        - arn:aws:s3:::public.ramadoka.com/*
        - arn:aws:s3:::private.ramadoka.com
        - arn:aws:s3:::private.ramadoka.com/*

  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true

  environment:
    ENV_PATH: '.env.prod'

functions:
  ws:
    handler: dist/functions/index.ws
    timeout: 10
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: $default

  api:
    handler: dist/functions/index.api
    timeout: 10
    events:
      - httpApi:
          path: "/{proxy+}"
          method: "*"
  cron:
    handler: dist/functions/index.cron
    timeout: 900
    events:
      - schedule:
          rate: cron(0 2 * * ? *) # every 02:00 UTC daily
          enabled: true
          input:
            pathParameters:
              proxy: "cron/ocr-service"
            requestContext:
              http:
                method: "POST"
      - schedule:
          rate: cron(0 14 * * ? *) # 14:00 UTC daily
          enabled: true
          input:
            pathParameters:
              proxy: "cron/ocr-service"
            requestContext:
              http:
                method: "POST"
      - schedule:
          rate: cron(0 1 * * ? *) # 01:00 UTC daily
          enabled: true
          input:
            pathParameters:
              proxy: "cron/mldn"
            requestContext:
              http:
                method: "POST"
      - schedule:
          rate: cron(0 13 * * ? *) # 13:00 UTC daily
          enabled: true
          input:
            pathParameters:
              proxy: "cron/autosync"
            requestContext:
              http:
                method: "POST"

package:
  individually: false
  include:
    - ".env.prod"
  exclude:
    - backup/**
    - src/playgrounds/**
    - node_modules/@aws-sdk/**
    - node_modules/@types/**

